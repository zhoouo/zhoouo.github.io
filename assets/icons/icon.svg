<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7D13C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5A623;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121214;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer border of Sudoku Grid -->
  <rect x="96" y="96" width="320" height="320" rx="16" fill="none" stroke="url(#grad)" stroke-width="12" filter="url(#shadow)"/>
  
  <!-- Inner Grid Lines -->
  <!-- Major Division Lines (3x3 blocks) -->
  <line x1="202.6" y1="96" x2="202.6" y2="416" stroke="url(#grad)" stroke-width="6"/>
  <line x1="309.3" y1="96" x2="309.3" y2="416" stroke="url(#grad)" stroke-width="6"/>
  <line x1="96" y1="202.6" x2="416" y2="202.6" stroke="url(#grad)" stroke-width="6"/>
  <line x1="96" y1="309.3" x2="416" y2="309.3" stroke="url(#grad)" stroke-width="6"/>
  
  <!-- Minor Division Lines (Individual cells) -->
  <line x1="131.5" y1="96" x2="131.5" y2="416" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="167.1" y1="96" x2="167.1" y2="416" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="238.2" y1="96" x2="238.2" y2="416" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="273.7" y1="96" x2="273.7" y2="416" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="344.8" y1="96" x2="344.8" y2="416" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="380.4" y1="96" x2="380.4" y2="416" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4"/>
  
  <line x1="96" y1="131.5" x2="416" y2="131.5" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="96" y1="167.1" x2="416" y2="167.1" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="96" y1="238.2" x2="416" y2="238.2" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="96" y1="273.7" x2="416" y2="273.7" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="96" y1="344.8" x2="416" y2="344.8" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="96" y1="380.4" x2="416" y2="380.4" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Sleek Glowing Sudoku Digit 'S' or '9' Style graphic -->
  <text x="256" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow)">S</text>
</svg>
